services:
  - type: web
    name: connect-app
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: UNION_NAME
        value: コネクト協同組合
      - key: PERMIT_NO
        value: 許1808000401
      # Turso (libSQL) の接続情報。Render無料プランは永続ディスクに対応しておらず、
      # サービスが再起動・スリープするとローカルファイルのDBは消えてしまうため、
      # 外部の永続DBであるTursoを使う。値はRenderダッシュボードで手動設定する
      # （sync: false = render.yamlに平文で書かない、Secretとして管理）。
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      # ログインセッションの署名に使う秘密鍵。未設定でも動作するが、
      # その場合は再デプロイのたびに全員ログアウトされる。
      # ランダムな長い文字列を手動で設定すると、再デプロイ後もログイン状態が保持される。
      - key: SESSION_SECRET
        sync: false
      # 週次自動バックアップ（/api/admin/import/backup-auto）の認証用トークン。
      # ランダムな長い文字列を手動で設定する。この値を知っている人だけが
      # ログインなしで全データのバックアップを取得できるため、他人に教えない。
      - key: BACKUP_TOKEN
        sync: false