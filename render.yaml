services:
  - type: web
    name: connect-app
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: UNION_NAME
        value: コネクト協同組合
      - key: PERMIT_NO
        value: 許1808000401
    # 無料プランは永続ディスクに対応していないため、DB (data.sqlite3) は
    # サービスの再起動では保持されますが、再デプロイのたびにリセットされます。
    # 有料プランに切り替える場合は DB_PATH と disk 設定を追加してください。