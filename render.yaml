services:
  - type: web
    name: connect-app
    # 技能実習計画認定申請書の実物様式PDF出力にLibreOffice（headless変換）と
    # Python（python-docx）が必要なため、通常のNode buildpackではなくDockerで
    # デプロイする（Dockerfile参照）。
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: UNION_NAME
        value: コネクト協同組合
      - key: PERMIT_NO
        value: 許1808000401
      # Turso (libSQL) の接続情報。Render無料プランは永続ディスクに対応しておらず、
      # サービスが再起動・スリープするとローカルファイルのDBは消えてしまうため、
      # 外部の永続DBであるTursoを使う。値はRenderダッシュボードで手動設定する
      # （sync: false = render.yamlに平文で書かない、Secretとして管理）。
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      # ログインセッションの署名に使う秘密鍵。未設定でも動作するが、
      # その場合は再デプロイのたびに全員ログアウトされる。
      # ランダムな長い文字列を手動で設定すると、再デプロイ後もログイン状態が保持される。
      - key: SESSION_SECRET
        sync: false
      # 週次自動バックアップ（/api/admin/import/backup-auto, backup-to-drive-auto）の
      # 認証用トークン。ランダムな長い文字列を手動で設定する。この値を知っている
      # 人だけがログインなしで全データのバックアップを取得できるため、他人に教えない。
      - key: BACKUP_TOKEN
        sync: false
      # Google Driveへの自動バックアップ用（サービスアカウント方式）。
      # Google Cloud ConsoleでサービスアカウントのJSON鍵を作成し、その中身を
      # そのまま貼り付ける。バックアップ保存先フォルダをそのサービスアカウントの
      # メールアドレスに「編集者」として共有しておく必要がある。
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      # バックアップの保存先Google DriveフォルダのID（フォルダのURL末尾の文字列）。
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      # 一時的にアプリを閉じておきたい時のメンテナンスモード。true にすると
      # /health 以外の全アクセスに「メンテナンス中」ページを返す（ログイン中の
      # 人も含めて全員）。元に戻すには false にする（またはこの変数を削除）。
      - key: MAINTENANCE_MODE
        value: "false"
      # メンテナンスモード中でも管理者だけがアクセスできるようにするための秘密
      # トークン。ランダムな長い文字列を手動で設定する。設定後、対象のURLに
      # ?bypass=<このトークン> を付けて一度アクセスすれば、以後はブラウザに
      # Cookieが保存され、メンテナンス中でも通常通り使い続けられる。
      - key: MAINTENANCE_BYPASS_TOKEN
        sync: false