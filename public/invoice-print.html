<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>口座引落のご案内 – コネクト協同組合</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    :root {
      --ink: #1a1a1a;
      --line: #333;
      --muted: #555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #e5e5e5;
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--ink);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #1f2937;
    }
    .toolbar button {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      font-family: "Noto Sans JP", sans-serif;
      cursor: pointer;
    }
    .toolbar .btn-print { background: #4f46e5; color: #fff; }
    .toolbar .btn-close { background: #374151; color: #e5e7eb; }

    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 20px auto 60px;
      padding: 14mm 14mm 12mm;
      background: #fff;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
      font-size: 12.5px;
      line-height: 1.5;
    }

    .doc-title-row {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 4px;
    }
    .doc-title { font-size: 23px; font-weight: 900; letter-spacing: 0.02em; }
    .doc-meta { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .doc-meta div { margin-top: 3px; }

    .header-grid {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 18px;
      gap: 20px;
    }

    .recipient { padding-top: 6px; }
    .recipient .postal { font-size: 13.5px; }
    .recipient .address { font-size: 13.5px; margin-top: 3px; }
    .recipient .name-row {
      margin-top: 22px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .recipient .name { font-size: 20px; font-weight: 700; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
    .recipient .onchu { font-size: 15px; }
    .recipient .code { margin-top: 5px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .issuer { text-align: left; width: 300px; }
    .issuer-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .issuer-brand img.logo { height: 54px; width: auto; }
    .issuer-brand .brand-jp { font-size: 17px; font-weight: 700; color: var(--ink); }
    .issuer-lines { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
    .issuer-lines .reg-number { margin-top: 3px; font-variant-numeric: tabular-nums; }
    /* 会社名のすぐ右、少し重なる位置に角印を配置する（実際の請求書の慣例に合わせる） */
    .issuer-stamp { width: 66px; height: 66px; margin-left: -16px; opacity: 0.9; mix-blend-mode: multiply; pointer-events: none; flex-shrink: 0; }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 26px;
      gap: 24px;
    }

    .debit-date-block .label { font-size: 13.5px; }
    .debit-date-block .date {
      font-size: 24px;
      font-weight: 700;
      border-bottom: 2px solid var(--line);
      padding-bottom: 4px;
      margin-top: 4px;
      min-width: 210px;
    }
    .debit-date-block .note { font-size: 11px; color: var(--muted); margin-top: 5px; }

    table.tax-summary {
      border-collapse: collapse;
      font-size: 12.5px;
    }
    table.tax-summary th, table.tax-summary td {
      border: 1px solid var(--line);
      padding: 6px 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    table.tax-summary th { background: #f4f4f4; font-weight: 500; text-align: center; }
    table.tax-summary td.grand { font-weight: 700; font-size: 15px; }

    table.items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 22px;
      font-size: 11.5px;
      border: 1px solid var(--line);
    }
    table.items-table th {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 6px 8px;
      font-weight: 500;
      background: #f4f4f4;
    }
    table.items-table th:last-child { border-right: none; }
    table.items-table td {
      border-bottom: 1px solid #ccc;
      border-right: 1px solid var(--line);
      padding: 5px 8px;
      vertical-align: top;
    }
    table.items-table td:last-child { border-right: none; }
    table.items-table th:nth-child(1), table.items-table td:nth-child(1) { width: 32px; text-align: center; }
    table.items-table th:nth-child(3), table.items-table td:nth-child(3) { width: 56px; text-align: center; }
    table.items-table th:nth-child(4), table.items-table td:nth-child(4) { width: 50px; text-align: center; }
    table.items-table th:nth-child(5), table.items-table td:nth-child(5),
    table.items-table th:nth-child(6), table.items-table td:nth-child(6) {
      width: 90px; text-align: right; font-variant-numeric: tabular-nums;
    }
    table.items-table tr.sub-row td {
      color: var(--muted);
      font-size: 10.5px;
      padding-top: 0;
    }
    table.items-table tr.filler td { height: 20px; }

    .bottom-note {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .bottom-note .bank { color: var(--muted); }
    .bottom-note .bank .masked { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

    .loading, .error-msg {
      max-width: 600px;
      margin: 80px auto;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    .error-msg { color: #b42318; }

    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { box-shadow: none; margin: 0; width: auto; min-height: 0; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar" id="toolbar" hidden>
    <button class="btn-print" onclick="window.print()">🖨 印刷 / PDF保存</button>
    <button class="btn-close" onclick="window.close()">閉じる</button>
  </div>

  <div id="loadingMsg" class="loading">読み込み中...</div>
  <div id="errorMsg" class="error-msg" hidden></div>
  <div class="sheet" id="sheet" hidden></div>

  <script src="js/api.js"></script>
  <script>
    function formatJpDate(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      if (!y || !m || !d) return iso;
      return `${y}年${Number(m)}月${Number(d)}日`;
    }
    function yen(n) {
      return (n ?? 0).toLocaleString('ja-JP');
    }
    // 受入企業の住所は「〒999-9999 ○○県○○市...」の形で1フィールドに保存されている。
    // サンプルの請求書では宛先側の郵便番号だけ「〒 999-9999」と1文字分空けて別行に
    // なっているため、ここで分割して再現する（分割できない場合はそのまま1行で表示）。
    function splitPostalAddress(address) {
      const m = String(address || '').match(/^〒\s*(\d{3}-\d{4})\s*(.*)$/);
      if (!m) return null;
      return { postal: m[1], rest: m[2] };
    }

    async function main() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('loadingMsg').hidden = true;
        const err = document.getElementById('errorMsg');
        err.hidden = false;
        err.textContent = '請求書IDが指定されていません。';
        return;
      }

      const res = await fetch('/api/auth/me');
      if (!res.ok) {
        window.location.href = '/login.html';
        return;
      }

      let inv;
      try {
        inv = await api.get(`/api/invoices/${id}`);
      } catch (e) {
        document.getElementById('loadingMsg').hidden = true;
        const err = document.getElementById('errorMsg');
        err.hidden = false;
        err.textContent = '請求書の取得に失敗しました。';
        return;
      }

      const issuer = inv.issuer;
      const company = inv.company;
      const bankAccountTypeDisplay = (company && company.bankAccountLast3) ? (company.bankAccountType || '普通') : issuer.bankAccountType;
      const bankAccountMaskedDisplay = (company && company.bankAccountLast3) ? `＊＊＊＊${company.bankAccountLast3}` : issuer.bankAccountMasked;

      const itemRows = inv.items
        .map((item, i) => {
          const taxLabel = item.taxCategory === 'exempt' ? '対象外' : '10%';
          const subInfo = item.workerName
            ? `${escapeHtml(item.workerName)}${item.workerGeneration ? '　' + escapeHtml(item.workerGeneration) : ''}${
                item.workerContractStartDate || item.workerContractEndDate
                  ? `　（${escapeHtml(item.workerContractStartDate || '？')}～${escapeHtml(item.workerContractEndDate || '？')}）`
                  : ''
              }`
            : '';
          const mainRow = `
            <tr>
              <td>${i + 1}</td>
              <td>${escapeHtml(item.description)}</td>
              <td>${taxLabel}</td>
              <td>${item.quantity}</td>
              <td>${yen(item.unitPrice)}</td>
              <td>${yen(item.amount)}</td>
            </tr>`;
          const subRow = subInfo
            ? `<tr class="sub-row"><td></td><td>${subInfo}</td><td></td><td></td><td></td><td></td></tr>`
            : '';
          return { html: mainRow + subRow, rowCount: subInfo ? 2 : 1 };
        });

      const usedRowCount = itemRows.reduce((sum, r) => sum + r.rowCount, 0);
      // 実物の伝票のように、明細が少ない場合も罫線を下まで空欄で埋めておく
      const TARGET_ROW_COUNT = 26;
      const fillerCount = Math.max(0, TARGET_ROW_COUNT - usedRowCount);
      const fillerRows = Array.from({ length: fillerCount }, () => '<tr class="filler"><td></td><td></td><td></td><td></td><td></td><td></td></tr>').join('');
      const itemRowsHtml = itemRows.map((r) => r.html).join('') + fillerRows;

      const addressSplit = company && company.address ? splitPostalAddress(company.address) : null;
      const recipientAddressHtml = addressSplit
        ? `<div class="postal">〒 ${escapeHtml(addressSplit.postal)}</div><div class="address">${escapeHtml(addressSplit.rest)}</div>`
        : company && company.address
          ? `<div class="address">${escapeHtml(company.address)}</div>`
          : '';

      const sheet = document.getElementById('sheet');
      sheet.innerHTML = `
        <div class="doc-title-row">
          <div class="doc-title">口座引落のご案内</div>
          <div class="doc-meta">
            <div>発行日　${escapeHtml(formatJpDate(inv.issueDate))}</div>
            <div>請求書番号：　${escapeHtml(inv.invoiceNumber)}</div>
          </div>
        </div>

        <div class="header-grid">
          <div class="recipient">
            ${recipientAddressHtml}
            <div class="name-row">
              <span class="name">${escapeHtml(inv.companyName)}</span>
              <span class="onchu">御中</span>
            </div>
            ${company && company.companyNo ? `<div class="code">${escapeHtml(String(company.companyNo).padStart(3, '0'))}</div>` : ''}
          </div>
          <div class="issuer">
            <div class="issuer-brand">
              <img src="assets/logo.png" alt="CONNECT" class="logo" />
              <span class="brand-jp">${escapeHtml(issuer.name)}</span>
              <img src="assets/stamp.png" alt="印" class="issuer-stamp" />
            </div>
            <div class="issuer-lines">
              〒${escapeHtml(issuer.postalCode)}<br />
              ${escapeHtml(issuer.address)}<br />
              tel ${escapeHtml(issuer.tel)}　fax ${escapeHtml(issuer.fax)}
              <div class="reg-number">登録番号：${escapeHtml(issuer.registrationNumber)}</div>
            </div>
          </div>
        </div>

        <div class="summary-row">
          <div class="debit-date-block">
            <div class="label">口座引落日</div>
            <div class="date">${escapeHtml(formatJpDate(inv.dueDate)) || '－'}</div>
            <div class="note">金融機関が休日の場合は翌営業日になります。</div>
          </div>
          <table class="tax-summary">
            <thead>
              <tr><th>課税対象外額</th><th>課税対象額</th><th>内消費税(10%)</th><th>今回引落額</th></tr>
            </thead>
            <tbody>
              <tr>
                <td>${yen(inv.taxExemptTotal)}</td>
                <td>${yen(inv.taxableTotal)}</td>
                <td>${yen(inv.taxAmount)}</td>
                <td class="grand">${yen(inv.grandTotal)}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <table class="items-table">
          <thead>
            <tr><th>No.</th><th>項　目</th><th>区分</th><th>数量</th><th>単価</th><th>金額</th></tr>
          </thead>
          <tbody>
            ${itemRowsHtml}
          </tbody>
        </table>

        <div class="bottom-note">
          <div>貴社指定口座　※ 引落し日前日までにご入金をお願い致します。</div>
          <div class="bank">${escapeHtml(bankAccountTypeDisplay)}　<span class="masked">${escapeHtml(bankAccountMaskedDisplay)}</span>　${escapeHtml(issuer.bankAccountNote)}</div>
        </div>
      `;

      document.getElementById('loadingMsg').hidden = true;
      document.getElementById('toolbar').hidden = false;
      sheet.hidden = false;
    }

    main();
  </script>
</body>
</html>
