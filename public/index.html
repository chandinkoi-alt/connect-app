<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect – 技能実習・育成就労・特定技能 管理システム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">C</div>
        <div class="brand-text">
          <div class="brand-name">Connect</div>
          <div class="brand-sub">業務管理システム</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="tabsNav">
        <button class="tab-btn" data-tab="dashboard" data-title="ダッシュボード">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
          <span class="nav-label">ダッシュボード</span>
        </button>
        <button class="tab-btn" data-tab="recruitment" data-title="採用活動">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="12.5" x2="21" y2="12.5"/></svg>
          <span class="nav-label">採用活動</span>
        </button>
        <button class="tab-btn" data-tab="sendingOrgs" data-title="送出機関">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
          <span class="nav-label">送出機関</span>
        </button>
        <button class="tab-btn" data-tab="workers" data-title="人材360">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 2.9-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M16 14.7c2.7.4 4.8 2.6 4.8 5.3"/></svg>
          <span class="nav-label">人材360</span>
        </button>
        <button class="tab-btn" data-tab="applications" data-title="認定申請">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="m9 14.5 2 2 4-4.5"/></svg>
          <span class="nav-label">認定申請</span>
        </button>
        <button class="tab-btn" data-tab="companies" data-title="受入企業360">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><line x1="9" y1="7.5" x2="9" y2="7.51"/><line x1="15" y1="7.5" x2="15" y2="7.51"/><line x1="9" y1="12" x2="9" y2="12.01"/><line x1="15" y1="12" x2="15" y2="12.01"/><line x1="10" y1="21" x2="10" y2="17" /><line x1="14" y1="21" x2="14" y2="17"/></svg>
          <span class="nav-label">受入企業360</span>
        </button>
        <button class="tab-btn" data-tab="visits" data-title="面談・監査">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 15.5 2 2 4-4.5"/></svg>
          <span class="nav-label">面談・監査</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="org-chip">
          <div class="org-avatar">連</div>
          <div class="org-info">
            <div class="org-name">コネクト協同組合</div>
            <div class="org-role">監理団体・登録支援機関</div>
          </div>
        </div>
        <div class="user-chip">
          <span id="currentUserName" class="user-name"></span>
          <div class="user-actions">
            <button id="addAccountBtn" class="link-btn user-action">アカウント追加</button>
            <button id="logoutBtn" class="link-btn user-action">ログアウト</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <h1 id="pageTitle">ダッシュボード</h1>
      </header>
      <main id="tabContent"></main>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/tabs/dashboard.js"></script>
  <script src="js/tabs/recruitment.js"></script>
  <script src="js/tabs/sendingOrgs.js"></script>
  <script src="js/tabs/workers.js"></script>
  <script src="js/tabs/applications.js"></script>
  <script src="js/tabs/companies.js"></script>
  <script src="js/tabs/visits.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
