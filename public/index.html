<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Công cụ tính lương nhân viên</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">💰 Công cụ tính lương nhân viên</div>
    <div class="sub-info">Tính lương, bảo hiểm, thuế TNCN theo biểu lũy tiến</div>
  </header>

  <main>
    <div class="grid">
      <section class="card">
        <h2 class="card-title">Nhập thông tin nhân viên</h2>
        <form id="salaryForm">
          <div class="form-group">
            <label for="name">Họ tên</label>
            <input type="text" id="name" required placeholder="Nguyễn Văn A" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="baseSalary">Lương cơ bản (VNĐ)</label>
              <input type="number" id="baseSalary" min="0" required value="10000000" />
            </div>
            <div class="form-group">
              <label for="standardDays">Ngày công chuẩn</label>
              <input type="number" id="standardDays" min="1" required value="26" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="actualDays">Ngày công thực tế</label>
              <input type="number" id="actualDays" min="0" required value="26" />
            </div>
            <div class="form-group">
              <label for="overtimeHours">Giờ tăng ca</label>
              <input type="number" id="overtimeHours" min="0" value="0" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="overtimeRate">Hệ số tăng ca</label>
              <input type="number" id="overtimeRate" min="1" step="0.1" value="1.5" />
            </div>
            <div class="form-group">
              <label for="allowance">Phụ cấp (VNĐ)</label>
              <input type="number" id="allowance" min="0" value="0" />
            </div>
          </div>

          <div class="form-group">
            <label for="dependents">Số người phụ thuộc</label>
            <input type="number" id="dependents" min="0" value="0" />
          </div>

          <button type="submit" class="btn btn-primary">➕ Tính & thêm vào bảng lương</button>
        </form>

        <div id="previewResult" class="preview"></div>
      </section>

      <section class="card">
        <div class="card-title-row">
          <h2 class="card-title">Bảng lương</h2>
          <button id="exportBtn" class="btn btn-success btn-small">📥 Xuất Excel</button>
        </div>
        <div class="table-wrap">
          <table id="salaryTable">
            <thead>
              <tr>
                <th>Họ tên</th>
                <th>Thu nhập</th>
                <th>Bảo hiểm</th>
                <th>Thuế TNCN</th>
                <th>Thực nhận</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="salaryTableBody">
              <tr class="empty-row">
                <td colspan="6">Chưa có nhân viên nào. Nhập thông tin bên trái để bắt đầu.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
