<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect – 技能実習・育成就労・特定技能 管理システム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">Connect 管理システム</div>
    <div class="sub-info">技能実習・育成就労・特定技能 業務管理</div>
  </header>

  <nav class="tabs-nav" id="tabsNav">
    <button class="tab-btn" data-tab="dashboard">ダッシュボード</button>
    <button class="tab-btn" data-tab="recruitment">採用活動</button>
    <button class="tab-btn" data-tab="sendingOrgs">送出機関</button>
    <button class="tab-btn" data-tab="workers">人材360</button>
    <button class="tab-btn" data-tab="applications">認定申請</button>
    <button class="tab-btn" data-tab="companies">受入企業360</button>
    <button class="tab-btn" data-tab="visits">面談・監査</button>
  </nav>

  <main id="tabContent"></main>

  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/tabs/dashboard.js"></script>
  <script src="js/tabs/recruitment.js"></script>
  <script src="js/tabs/sendingOrgs.js"></script>
  <script src="js/tabs/workers.js"></script>
  <script src="js/tabs/applications.js"></script>
  <script src="js/tabs/companies.js"></script>
  <script src="js/tabs/visits.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
