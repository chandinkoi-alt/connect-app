<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel一括インポート – Connect</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; justify-content: center; padding: 40px 16px; }
    .import-box { width: 100%; max-width: 560px; background: var(--color-surface); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); }
    .import-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .import-sub { font-size: 13px; color: var(--color-text-muted); margin-bottom: 24px; line-height: 1.7; }
    .result-box { margin-top: 20px; padding: 16px; border-radius: var(--radius-md); background: #f4f6fb; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
    .result-box.error { background: #fdecec; color: #b42318; }
    #progress { display: none; margin-top: 12px; font-size: 13px; color: var(--color-text-muted); }
  </style>
</head>
<body>
  <div class="import-box">
    <div class="import-title">Excel一括インポート（受入企業・人材一覧）</div>
    <div class="import-sub">
      既存の管理Excel（受入企業データ / 監理外国人名簿 / 監理外国人名簿(2) の3シートを含むファイル）をアップロードすると、
      受入企業・対象者・登録保険情報・認定申請の下書きを一括登録します。<br />
      ※ このデータベースに一度取り込んだ後にもう一度実行すると、同じデータが重複登録されます。基本的に一回のみ実行してください。
    </div>
    <form id="importForm">
      <div class="form-group">
        <input type="file" id="fileInput" accept=".xlsx" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">インポート実行</button>
    </form>
    <div id="progress">アップロード・処理中です。データ量によっては数分かかることがあります…</div>
    <div id="result" class="result-box" hidden></div>
  </div>

  <script>
    (async () => {
      const res = await fetch('/api/auth/me');
      if (!res.ok) window.location.href = '/login.html';
    })();

    function renderSummary(data) {
      // ワーカースレッド起動直後は summary がまだ null（最初の進捗報告前）のことがある。
      const s = data.summary || {
        companiesImported: 0, companiesTotal: 0, workersImported: 0, workersTotal: 0,
        workersSkippedOtherOrg: 0, sendingOrgsCreated: 0, registrationsCreated: 0,
        applicationCasesCreated: 0, auditRecordsCreated: 0, errors: [],
      };
      return (
        `受入企業: ${s.companiesImported} / ${s.companiesTotal}件\n` +
        `対象者: ${s.workersImported} / ${s.workersTotal}件\n` +
        `（他団体管理のため除外: ${s.workersSkippedOtherOrg}件）\n` +
        `送出機関 新規作成: ${s.sendingOrgsCreated}件\n` +
        `登録・保険項目: ${s.registrationsCreated}件\n` +
        `認定申請 下書き: ${s.applicationCasesCreated}件\n` +
        `監査記録: ${s.auditRecordsCreated}件\n` +
        (s.errors.length ? `\nエラー:\n${s.errors.join('\n')}` : '')
      );
    }

    async function pollStatus() {
      const resultBox = document.getElementById('result');
      const progress = document.getElementById('progress');
      const submitBtn = document.getElementById('submitBtn');

      try {
        const res = await fetch('/api/admin/import/status');
        const data = await res.json();

        if (data.status === 'idle' || data.status === 'running') {
          resultBox.hidden = false;
          resultBox.classList.remove('error');
          resultBox.textContent = '処理中…\n' + renderSummary(data);
          setTimeout(pollStatus, 2000);
          return;
        }

        progress.style.display = 'none';
        submitBtn.disabled = false;
        resultBox.hidden = false;

        if (data.status === 'error') {
          resultBox.classList.add('error');
          resultBox.textContent = 'エラーが発生しました: ' + (data.error || '');
          return;
        }

        resultBox.classList.remove('error');
        resultBox.textContent = renderSummary(data) + ((data.summary && data.summary.errors.length) ? '' : '\nエラーなし');
      } catch (err) {
        // ポーリング自体の通信エラーはリトライし続ける（無限に沈黙して固まるのを防ぐ）。
        resultBox.hidden = false;
        resultBox.textContent = '処理中…（通信エラーが発生しましたが再試行します: ' + err.message + '）';
        setTimeout(pollStatus, 3000);
      }
    }

    document.getElementById('importForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      const resultBox = document.getElementById('result');
      const progress = document.getElementById('progress');
      const submitBtn = document.getElementById('submitBtn');
      if (!fileInput.files.length) return;

      resultBox.hidden = true;
      progress.style.display = 'block';
      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const res = await fetch('/api/admin/import/excel', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) {
          progress.style.display = 'none';
          submitBtn.disabled = false;
          resultBox.hidden = false;
          resultBox.classList.add('error');
          resultBox.textContent = data.error || 'エラーが発生しました。';
          return;
        }
        setTimeout(pollStatus, 1000);
      } catch (err) {
        progress.style.display = 'none';
        submitBtn.disabled = false;
        resultBox.hidden = false;
        resultBox.classList.add('error');
        resultBox.textContent = '通信エラーが発生しました: ' + err.message;
      }
    });
  </script>
</body>
</html>
