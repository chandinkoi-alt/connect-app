<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン – Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(160deg, #111827, #1e1b4b 60%, #111827);
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .login-logo {
      height: 76px;
      width: auto;
    }
    .login-brand-sub {
      font-size: 13px;
      color: var(--color-text-muted);
      font-family: var(--font-jp);
    }
    .login-title {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--font-jp);
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 12.5px;
      color: var(--color-text-muted);
      font-family: var(--font-jp);
      margin-bottom: 22px;
    }
    .alert-error[hidden] {
      display: none;
    }
    .btn .spinner {
      width: 14px;
      height: 14px;
      border-width: 2px;
      vertical-align: -2px;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-brand">
      <img src="assets/logo.png" alt="CONNECT" class="login-logo" />
      <div class="login-brand-sub">業務管理システム</div>
    </div>

    <div id="setupView" hidden>
      <div class="login-title">初回セットアップ</div>
      <div class="login-sub">管理者アカウントを作成してください。</div>
      <form id="setupForm">
        <div class="form-group">
          <label>お名前</label>
          <input type="text" id="setupName" placeholder="山田 太郎" />
        </div>
        <div class="form-group">
          <label>ユーザー名 *</label>
          <input type="text" id="setupUsername" required minlength="3" />
        </div>
        <div class="form-group">
          <label>パスワード（6文字以上） *</label>
          <input type="password" id="setupPassword" required minlength="6" />
        </div>
        <div id="setupErrors" class="alert-error" hidden></div>
        <button type="submit" class="btn btn-primary">アカウントを作成してログイン</button>
      </form>
    </div>

    <div id="loginView">
      <div class="login-title">ログイン</div>
      <div class="login-sub">アカウント情報を入力してください。</div>
      <form id="loginForm">
        <div class="form-group">
          <label>ユーザー名</label>
          <input type="text" id="loginUsername" required />
        </div>
        <div class="form-group">
          <label>パスワード</label>
          <input type="password" id="loginPassword" required />
        </div>
        <div id="loginErrors" class="alert-error" hidden></div>
        <button type="submit" class="btn btn-primary">ログイン</button>
      </form>
    </div>
  </div>

  <script>
    const setupView = document.getElementById('setupView');
    const loginView = document.getElementById('loginView');

    async function init() {
      // デフォルトはログイン画面。初回セットアップ（管理者アカウントが1件も無い場合のみ）に該当する時だけ切り替える。
      const res = await fetch('/api/auth/setup-needed');
      const { needed } = await res.json();
      if (needed) {
        loginView.hidden = true;
        setupView.hidden = false;
      }
    }

    function setButtonLoading(btn, loading, loadingText) {
      if (loading) {
        btn.dataset.originalText = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner spinner-light"></span>${loadingText}`;
      } else {
        btn.disabled = false;
        btn.textContent = btn.dataset.originalText || btn.textContent;
      }
    }

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      setButtonLoading(btn, true, '作成中...');
      const body = {
        name: document.getElementById('setupName').value,
        username: document.getElementById('setupUsername').value,
        password: document.getElementById('setupPassword').value,
      };
      try {
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          const el = document.getElementById('setupErrors');
          el.textContent = (data.errors || [data.error]).join(' / ');
          el.hidden = false;
          setButtonLoading(btn, false);
          return;
        }
        window.location.href = '/';
      } catch (err) {
        setButtonLoading(btn, false);
        throw err;
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      setButtonLoading(btn, true, 'ログイン中...');
      const body = {
        username: document.getElementById('loginUsername').value,
        password: document.getElementById('loginPassword').value,
      };
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        const el = document.getElementById('loginErrors');
        if (!res.ok) {
          el.textContent = (data.errors || [data.error]).join(' / ');
          el.hidden = false;
          setButtonLoading(btn, false);
          return;
        }
        el.hidden = true;
        window.location.href = '/';
      } catch (err) {
        setButtonLoading(btn, false);
        throw err;
      }
    });

    init();

    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
